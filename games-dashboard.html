<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد بازی‌ها</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 20px; color: white;
        }
        .dashboard {
            background: #1a1a1a; border-radius: 24px; padding: 2rem; width: 100%;
            max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); border: 2px solid #e94560;
            text-align: center;
        }
        .title {
            font-size: 2rem; color: #e94560; margin-bottom: 0.3rem;
        }
        .subtitle { color: #a2a8d3; margin-bottom: 2rem; font-size: 1rem; }
        .games-grid { display: flex; flex-direction: column; gap: 15px; }
        .game-card {
            background: #0d0d1a; border: 2px solid #333; border-radius: 20px;
            padding: 2rem 1.5rem; cursor: pointer; transition: all 0.3s ease;
            text-decoration: none; color: white; display: flex; align-items: center; gap: 20px;
        }
        .game-card:hover {
            border-color: #e94560; transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(233,69,96,0.3);
        }
        .game-card:active { transform: scale(0.97); }
        .game-icon { font-size: 4rem; flex-shrink: 0; }
        .game-info { text-align: right; flex: 1; }
        .game-info h3 { font-size: 1.4rem; margin-bottom: 5px; }
        .game-info p { font-size: 0.85rem; color: #888; line-height: 1.5; }
        .game-badge {
            display: inline-block; padding: 4px 12px; border-radius: 15px;
            font-size: 0.75rem; font-weight: bold; margin-top: 5px;
        }
        .badge-fun { background: rgba(243,156,18,0.2); color: #f39c12; }
        .badge-brain { background: rgba(78,204,163,0.2); color: #4ecca3; }
        .back-btn {
            display: inline-block; margin-top: 1.5rem; color: #888;
            text-decoration: none; font-size: 0.9rem; transition: 0.3s;
        }
        .back-btn:hover { color: #e94560; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="title">🎮 داشبورد بازی‌ها</div>
        <div class="subtitle">یکی از بازی‌ها رو انتخاب کن!</div>

        <div class="games-grid">
            <!-- جوک‌ساز -->
            <div class="game-card" onclick="openGame('joke-maker.html')">
                <div class="game-icon">😂</div>
                <div class="game-info">
                    <h3>جوک‌ساز خنده‌دار</h3>
                    <p>جوک‌های بامزه بخون، بخند و با دوستات به اشتراک بذار!</p>
                    <span class="game-badge badge-fun">🎉 سرگرمی</span>
                </div>
            </div>

            <!-- چیستان -->
            <div class="game-card" onclick="openGame('chistan.html')">
                <div class="game-icon">🧩</div>
                <div class="game-info">
                    <h3>بازی چیستان</h3>
                    <p>معماها رو حل کن، امتیاز بگیر و هوشت رو بسنج!</p>
                    <span class="game-badge badge-brain">🧠 فکری</span>
                </div>
            </div>
        </div>

        <a href="dashboard1.html" class="back-btn">🏠 بازگشت به داشبورد اصلی</a>
    </div>

    <script>
        function openGame(file) {
            window.open(file, '_blank');
        }
    </script>
</body>
</html>
