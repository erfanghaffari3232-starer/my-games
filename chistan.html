<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی چیستان</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 20px; color: white;
        }
        .game {
            background: #1a1a1a; border-radius: 24px; padding: 2rem; width: 100%;
            max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); border: 2px solid #f39c12;
            text-align: center;
        }
        .title { font-size: 2rem; color: #f39c12; margin-bottom: 0.5rem; }
        .score-area { display: flex; justify-content: center; gap: 20px; margin-bottom: 1.5rem; }
        .score-box { text-align: center; }
        .score-box .num { font-size: 2rem; font-weight: bold; color: #4ecca3; }
        .score-box .lbl { font-size: 0.8rem; color: #888; }
        .question-box {
            background: #0d0d1a; border: 1px solid #f39c12; border-radius: 16px;
            padding: 2rem 1.5rem; margin-bottom: 1.5rem; font-size: 1.2rem; line-height: 1.8;
        }
        .question-num { color: #f39c12; font-size: 0.9rem; margin-bottom: 0.8rem; }
        .question-text { color: white; font-size: 1.3rem; }
        .hint-text { color: #888; font-size: 0.9rem; margin-top: 1rem; display: none; }
        .hint-text.show { display: block; color: #f39c12; }
        .input-area { display: flex; gap: 8px; margin-bottom: 1rem; }
        .input-area input {
            flex: 1; background: #0d0d1a; border: 2px solid #533483; padding: 12px 15px;
            border-radius: 12px; color: white; font-size: 1.1rem; font-family: inherit; text-align: center;
        }
        .input-area input:focus { outline: none; border-color: #f39c12; }
        .input-area button {
            background: #f39c12; color: #1a1a1a; border: none; padding: 12px 20px;
            border-radius: 12px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 1rem;
        }
        .input-area button:hover { background: #e67e22; }
        .hint-btn {
            background: #533483; color: white; border: none; padding: 8px 16px;
            border-radius: 8px; cursor: pointer; font-family: inherit; margin-bottom: 0.5rem;
        }
        .hint-btn:hover { background: #6c3fa0; }
        .message { min-height: 30px; font-size: 1.1rem; font-weight: bold; margin: 0.5rem 0; }
        .message.correct { color: #4ecca3; }
        .message.wrong { color: #e94560; }
        .new-game-btn {
            background: #2a2a2a; color: white; border: 1px solid #444; padding: 10px 20px;
            border-radius: 10px; cursor: pointer; font-family: inherit; font-size: 0.9rem; margin-top: 0.5rem;
        }
        .new-game-btn:hover { background: #e94560; border-color: #e94560; }
        .emoji-celebrate { font-size: 3rem; display: none; }
        .emoji-celebrate.show { display: block; animation: bounce 0.6s ease; }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
    </style>
</head>
<body>
    <div class="game">
        <div class="title">🧩 چیستان</div>

        <!-- امتیاز -->
        <div class="score-area">
            <div class="score-box"><div class="num" id="correctCount">۰</div><div class="lbl">✅ درست</div></div>
            <div class="score-box"><div class="num" id="wrongCount">۰</div><div class="lbl">❌ غلط</div></div>
            <div class="score-box"><div class="num" id="totalCount">۰</div><div class="lbl">📊 کل</div></div>
        </div>

        <!-- ایموجی -->
        <div class="emoji-celebrate" id="emojiCelebrate">🎉</div>

        <!-- سوال -->
        <div class="question-box">
            <div class="question-num" id="questionNum">سوال ۱ از ۲۰</div>
            <div class="question-text" id="questionText">-</div>
            <div class="hint-text" id="hintText">راهنمایی: -</div>
        </div>

        <!-- دکمه راهنمایی -->
        <button class="hint-btn" onclick="showHint()">💡 راهنمایی</button>

        <!-- ورودی -->
        <div class="input-area">
            <input type="text" id="answerInput" placeholder="پاسخ را بنویسید..." onkeypress="if(event.key==='Enter') checkAnswer()">
            <button onclick="checkAnswer()">✅</button>
        </div>

        <!-- پیام -->
        <div class="message" id="message"></div>

        <!-- دکمه‌ها -->
        <button class="new-game-btn" onclick="nextQuestion()">⏭️ سوال بعدی</button>
        <button class="new-game-btn" onclick="resetGame()" style="margin-right:5px;">🔄 شروع دوباره</button>
    </div>

    <script>
        const questions = [
            { q: 'آن چیست که هرچه بیشتر از آن بردارید، بزرگتر می‌شود؟', a: 'چاله', h: 'تو زمین ایجاد میشه' },
            { q: 'آن چیست که یک چشم دارد اما نمی‌تواند ببیند؟', a: 'سوزن', h: 'برای دوختن استفاده میشه' },
            { q: 'آن چیست که هرچه بیشتر باشد، کمتر می‌بینی؟', a: 'تاریکی', h: 'وقتی چراغ خاموشه' },
            { q: 'آن چیست که بالا می‌رود اما پایین نمی‌آید؟', a: 'سن', h: 'هر سال یکی بهش اضافه میشه' },
            { q: 'آن چیست که مال توست اما دیگران بیشتر از تو از آن استفاده می‌کنند؟', a: 'اسم', h: 'همه صدات می‌زنن' },
            { q: 'آن چیست که پر از سوراخ است اما آب را نگه می‌دارد؟', a: 'اسفنج', h: 'توی حمام ازش استفاده می‌کنی' },
            { q: 'آن چیست که هرچه بیشتر خشک شود، خیس‌تر می‌شود؟', a: 'حوله', h: 'بعد از حمام استفاده میشه' },
            { q: 'آن چیست که می‌تواند دور دنیا بگردد اما گوشه اتاق بماند؟', a: 'تمبر', h: 'روی نامه می‌چسبه' },
            { q: 'آن چیست که هرچه بیشتر از آن بردارید، کمتر می‌شود؟', a: 'سوراخ', h: 'برعکس چاله‌ست!' },
            { q: 'آن چیست که صبح چهار پا، ظهر دو پا و شب سه پا راه می‌رود؟', a: 'انسان', h: 'معمای ابوالهول' },
            { q: 'آن چیست که هرگز سوال نمی‌پرسد اما همیشه جواب دارد؟', a: 'تلفن', h: 'زنگ می‌خوره جواب میدی' },
            { q: 'آن چیست که اگر اسمش را ببری، می‌شکند؟', a: 'سکوت', h: 'وقتی حرف می‌زنی تموم میشه' },
            { q: 'آن چیست که هرچه از آن بردارند، سنگین‌تر می‌شود؟', a: 'کیسه زباله', h: 'پر از آشغال میشه' },
            { q: 'آن چیست که در آب خیس نمی‌شود؟', a: 'سایه', h: 'همیشه همراهته' },
            { q: 'آن چیست که دهان دارد اما غذا نمی‌خورد؟', a: 'غار', h: 'توی کوه پیدا میشه' },
            { q: 'آن چیست که گردن دارد ولی سر ندارد؟', a: 'بطری', h: 'توش آب می‌ریزی' },
            { q: 'آن چیست که هرچه بلندتر باشد، کوتاه‌تر دیده می‌شود؟', a: 'راه', h: 'وقتی به دوردست نگاه می‌کنی' },
            { q: 'آن چیست که یک پا دارد و کلاه بر سر می‌گذارد؟', a: 'قارچ', h: 'توی جنگل پیدا میشه' },
            { q: 'آن چیست که پرنده نیست اما پرواز می‌کند؟', a: 'بادکنک', h: 'توی جشن تولد هست' },
            { q: 'آن چیست که دندان دارد اما گاز نمی‌گیرد؟', a: 'شانه', h: 'برای مو استفاده میشه' }
        ];

        let currentQuestion = 0;
        let score = { correct: 0, wrong: 0, total: 0 };
        let hintUsed = false;
        let answered = false;

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                gameFinished();
                return;
            }

            answered = false;
            hintUsed = false;
            
            document.getElementById('questionNum').textContent = `سوال ${currentQuestion + 1} از ${questions.length}`;
            document.getElementById('questionText').textContent = questions[currentQuestion].q;
            document.getElementById('hintText').textContent = 'راهنمایی: ' + questions[currentQuestion].h;
            document.getElementById('hintText').classList.remove('show');
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').focus();
            document.getElementById('message').textContent = '';
            document.getElementById('message').className = 'message';
            document.getElementById('emojiCelebrate').classList.remove('show');
            
            updateScores();
        }

        function showHint() {
            if (answered) return;
            document.getElementById('hintText').classList.add('show');
            hintUsed = true;
        }

        function checkAnswer() {
            if (answered) return;
            
            const userAnswer = document.getElementById('answerInput').value.trim();
            if (!userAnswer) return;

            const correctAnswer = questions[currentQuestion].a;
            
            answered = true;
            score.total++;

            if (userAnswer === correctAnswer || userAnswer.includes(correctAnswer) || correctAnswer.includes(userAnswer)) {
                // جواب درست
                score.correct++;
                document.getElementById('message').textContent = '✅ آفرین! درست گفتی!';
                document.getElementById('message').className = 'message correct';
                document.getElementById('emojiCelebrate').classList.add('show');
            } else {
                // جواب غلط
                score.wrong++;
                document.getElementById('message').textContent = `❌ نه! جواب درست: ${correctAnswer}`;
                document.getElementById('message').className = 'message wrong';
            }

            updateScores();
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        function updateScores() {
            document.getElementById('correctCount').textContent = score.correct.toLocaleString('fa-IR');
            document.getElementById('wrongCount').textContent = score.wrong.toLocaleString('fa-IR');
            document.getElementById('totalCount').textContent = score.total.toLocaleString('fa-IR');
        }

        function gameFinished() {
            document.getElementById('questionText').textContent = '🎉 تموم شد! آفرین!';
            document.getElementById('questionNum').textContent = '';
            document.getElementById('hintText').classList.remove('show');
            document.getElementById('message').textContent = `نمره تو: ${score.correct} از ${questions.length}`;
            document.getElementById('message').className = 'message correct';
        }

        function resetGame() {
            currentQuestion = 0;
            score = { correct: 0, wrong: 0, total: 0 };
            loadQuestion();
        }

        // شروع بازی
        loadQuestion();
    </script>
</body>
</html>
